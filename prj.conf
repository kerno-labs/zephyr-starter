# 启用控制台设备支持。
CONFIG_CONSOLE=y
# 启用串口驱动支持，供控制台和 Shell 使用。
CONFIG_SERIAL=y
# 启用 Zephyr 日志子系统。
CONFIG_LOG=y
# 采用延迟模式输出日志，降低实时路径的阻塞。
CONFIG_LOG_MODE_DEFERRED=y
# 应用自身的编译告警不升级为错误；第三方模块仍可能保留其独立策略。
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
# 将主线程栈空间设为 4096 字节。
CONFIG_MAIN_STACK_SIZE=4096
# 将系统工作队列栈空间设为 4096 字节。
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# 支持解析 RSA 类型的证书公钥。
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
# 支持 RSA PKCS#1 v1.5 签名算法。
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y

# 启用传感器子系统。
CONFIG_SENSOR=y
# 启用 nanopb Protocol Buffers 编解码支持。
CONFIG_NANOPB=y
# 启用 ESP32 内置温度传感器驱动。
CONFIG_ESP32_TEMP=y
# 启用 RTC 子系统。
CONFIG_RTC=y
# 启用 PCF8563 实时时钟驱动。
CONFIG_RTC_PCF8563=y

# 启用 Zephyr 网络协议栈。
CONFIG_NETWORKING=y
# 启用 IPv4 协议支持。
CONFIG_NET_IPV4=y
# 启用 IPv4 DHCP 客户端自动获取地址。
CONFIG_NET_DHCPV4=y
# 启用 TCP 协议支持。
CONFIG_NET_TCP=y
# 启用 BSD Socket API。
CONFIG_NET_SOCKETS=y
# 启用 DNS 域名解析器。
CONFIG_DNS_RESOLVER=y
# 启用 Wi-Fi 二层网络管理接口。
CONFIG_NET_L2_WIFI_MGMT=y
# 启用通用 Wi-Fi 支持。
CONFIG_WIFI=y
# 启用 ESP32 Wi-Fi 驱动。
CONFIG_WIFI_ESP32=y
# 本机未安装 Espressif Wi-Fi blobs 时只用于编译验证；实板联网必须删除。
CONFIG_BUILD_ONLY_NO_BLOBS=y

# 启用 MQTT 客户端库。
CONFIG_MQTT_LIB=y
# 为 MQTT 客户端启用 TLS 支持。
CONFIG_MQTT_LIB_TLS=y
# 允许通过 Socket 选项配置 TLS。
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# 启用 mbedTLS 加密库。
CONFIG_MBEDTLS=y
# 允许 mbedTLS 使用动态堆内存。
CONFIG_MBEDTLS_ENABLE_HEAP=y
# 为 mbedTLS 分配 40000 字节堆空间。
CONFIG_MBEDTLS_HEAP_SIZE=40000
# 启用 mbedTLS 通用消息摘要模块。
CONFIG_MBEDTLS_MD_C=y
# 启用 SHA-256 算法。
CONFIG_PSA_WANT_ALG_SHA_256=y
# 支持解析 PEM 格式证书。
CONFIG_MBEDTLS_PEM_PARSE_C=y
# 支持解析 X.509 证书。
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# TLS 握手中使用 Broker 主机名作为 SNI。
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
# 启用 TLS 1.2 ECDHE-RSA-AES128-GCM-SHA256 加密套件。
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
# 为 TLS 和随机 MQTT 消息 ID 提供熵源。
CONFIG_ENTROPY_GENERATOR=y

# 启用交互式 Shell。
CONFIG_SHELL=y
# 将 Shell 后端绑定到串口。
CONFIG_SHELL_BACKEND_SERIAL=y
# 将 Shell 线程栈空间设为 2048 字节。
CONFIG_SHELL_STACK_SIZE=2048
